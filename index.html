<!DOCTYPE html>
<html lang="en" data-variant="v1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Akagi Technologies</title>
<meta name="description" content="Akagi Technologies">
<meta name="theme-color" content="#f4f1ea">
<meta property="og:title" content="Akagi Technologies">
<meta property="og:site_name" content="Akagi Technologies">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20fill='%23f4f1ea'/%3E%3Ccircle%20cx='16'%20cy='16'%20r='8.5'%20fill='none'%20stroke='%2316150f'%20stroke-width='2.5'/%3E%3C/svg%3E">

<style>
  /* ---- reset ------------------------------------------------------- */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  /* ---- shared spine ------------------------------------------------ */
  :root {
    --serif: ui-serif, "Iowan Old Style", "Palatino Linotype", Palatino,
             "Book Antiqua", Georgia, "Times New Roman", serif;
    --pattern: none;
    --pattern-size: auto;
    --veil: none;
    --drift-x: 0px;
    --drift-y: 0px;
    --drift-time: 90s;
    --place: center;
    --pad: 8vmin;
    --align: center;
    --lift: 0;
  }

  body {
    min-height: 100vh;
    min-height: 100svh;
    background-color: var(--paper);
    color: var(--ink);
    font-family: var(--serif);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* Decorative pattern layer. Paper sits on .field; the pattern rides on
     ::before, oversized so its slow drift never exposes an edge; ::after
     holds a static paper-coloured veil that stays put while it moves. */
  .field {
    position: fixed;
    inset: 0;
    z-index: -1;
    overflow: hidden;
    background-color: var(--paper);
  }
  .field::before,
  .field::after { content: ""; position: absolute; }

  .field::before {
    inset: -25%;
    background-image: var(--pattern);
    background-size: var(--pattern-size);
    will-change: transform;
    animation:
      fade 1.6s ease both,
      drift var(--drift-time) linear infinite;
  }
  .field::after { inset: 0; background: var(--veil); }

  /* Drift translates by exactly one tile period, so the loop is seamless. */
  @keyframes drift {
    from { transform: translate3d(0, 0, 0); }
    to   { transform: translate3d(var(--drift-x), var(--drift-y), 0); }
  }
  /* v4 has no tiling to loop — its wash breathes instead. */
  @keyframes breathe {
    from { transform: translate3d(-1.5%, -1%, 0) scale(1.04); }
    to   { transform: translate3d( 1.5%,  1%, 0) scale(1.10); }
  }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes rise {
    from { opacity: 0; transform: translateY(calc(-1 * var(--lift) + .4em)); }
    to   { opacity: 1; transform: translateY(calc(-1 * var(--lift))); }
  }

  .stage {
    min-height: 100vh;
    min-height: 100svh;
    display: grid;
    place-content: var(--place);
    padding: var(--pad);
    text-align: var(--align);
  }

  .wordmark {
    margin: 0;
    font-weight: 400;
    font-size: var(--size);
    line-height: var(--leading, 1);
    letter-spacing: var(--tracking, 0);
    transform: translateY(calc(-1 * var(--lift)));
    animation: rise 1.05s cubic-bezier(.22, .68, .24, 1) .1s both;
  }
  .wordmark span { display: block; }

  /* ---- v1 — hairline grid, warm paper ------------------------------ */
  [data-variant="v1"] {
    --paper: #f4f1ea;
    --ink: #16150f;
    --pattern:
      repeating-linear-gradient(0deg,  rgba(22,21,15,.10) 0 1px, transparent 1px 34px),
      repeating-linear-gradient(90deg, rgba(22,21,15,.10) 0 1px, transparent 1px 34px);
    --drift-x: 34px;
    --drift-y: 34px;
    --drift-time: 90s;
    --size: clamp(2.6rem, 9vw, 7.5rem);
    --leading: .94;
    --tracking: -.015em;
    --lift: 4vh;
  }

  /* ---- v2 — dot field, dark paper ---------------------------------- */
  [data-variant="v2"] {
    --paper: #101418;
    --ink: #e8ebee;
    --pattern: radial-gradient(circle, rgba(232,235,238,.24) 1.4px, transparent 1.5px);
    --pattern-size: 30px 30px;
    --veil: radial-gradient(circle at 50% 42%, transparent 20%, var(--paper) 78%);
    --drift-x: 30px;
    --drift-y: 30px;
    --drift-time: 110s;
    --place: end start;
    --align: left;
    --pad: clamp(28px, 7vmin, 84px);
    --size: clamp(1.15rem, 3.2vw, 2.2rem);
    --leading: 1.5;
    --tracking: .24em;
  }
  [data-variant="v2"] .wordmark { font-variant-caps: all-small-caps; }

  /* ---- v3 — ruled, ivory ------------------------------------------- */
  [data-variant="v3"] {
    --paper: #faf6ec;
    --ink: #1a1712;
    --pattern: repeating-linear-gradient(0deg, rgba(26,23,18,.12) 0 1px, transparent 1px 46px);
    --drift-x: 0px;
    --drift-y: 46px;
    --drift-time: 70s;
    --size: clamp(1.5rem, 5vw, 3.4rem);
    --leading: 1.35;
    --tracking: .02em;
    --lift: 2vh;
  }
  [data-variant="v3"] .wordmark {
    border-bottom: 1px solid var(--ink);
    padding-bottom: .28em;
  }
  [data-variant="v3"] .wordmark span { display: inline; }

  /* ---- v4 — tint wash, no pattern ---------------------------------- */
  [data-variant="v4"] {
    --paper: #d9e0d5;
    --ink: #22281f;
    --pattern: radial-gradient(125% 95% at 18% 0%, rgba(255,255,255,.55), transparent 62%);
    --pattern-size: cover;
    --place: center start;
    --align: left;
    --pad: clamp(32px, 9vmin, 140px);
    --size: clamp(3rem, 12vw, 10rem);
    --leading: .88;
    --tracking: -.025em;
  }
  [data-variant="v4"] .field::before {
    animation: fade 1.6s ease both, breathe 48s ease-in-out infinite alternate;
  }

  /* ---- v5 — diagonal hairlines, dark paper, knocked-out panel ------- */
  [data-variant="v5"] {
    --paper: #14151a;
    --ink: #eceae4;
    --pattern: repeating-linear-gradient(45deg, rgba(236,234,228,.07) 0 1px, transparent 1px 15px);
    /* one 15px period along the gradient axis = 15/sqrt(2) on each axis */
    --drift-x: 10.607px;
    --drift-y: -10.607px;
    --drift-time: 80s;
    --size: clamp(1.9rem, 6.5vw, 5rem);
    --leading: 1.05;
    --tracking: .01em;
  }
  [data-variant="v5"] .wordmark {
    background: var(--paper);
    padding: clamp(20px, 5vmin, 56px) clamp(24px, 6vmin, 72px);
  }

  /* ---- motion opt-out ---------------------------------------------- */
  @media (prefers-reduced-motion: reduce) {
    .field::before,
    [data-variant="v4"] .field::before,
    .wordmark { animation: none; }
  }
</style>

<script>
  (function () {
    var V = ["v1", "v2", "v3", "v4", "v5"];
    var THEME = { v1: "#f4f1ea", v2: "#101418", v3: "#faf6ec", v4: "#d9e0d5", v5: "#14151a" };
    var KEY = "akagi:variant";

    var forced = (location.search.match(/[?&]v=v?(\d)/) || [])[1];
    var pick;

    if (forced && V.indexOf("v" + forced) > -1) {
      pick = "v" + forced;
    } else {
      var last = null;
      try { last = sessionStorage.getItem(KEY); } catch (e) {}
      pick = V[Math.floor(Math.random() * V.length)];
      if (pick === last) pick = V[Math.floor(Math.random() * V.length)];
      try { sessionStorage.setItem(KEY, pick); } catch (e) {}
    }

    document.documentElement.setAttribute("data-variant", pick);
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", THEME[pick]);
  })();
</script>
</head>

<body>
  <div class="field" aria-hidden="true"></div>
  <main class="stage">
    <h1 class="wordmark"><span>Akagi</span> <span>Technologies</span></h1>
  </main>
</body>
</html>
