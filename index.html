<!DOCTYPE html>
<html lang="en" data-variant="v1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Akagi Technologies</title>
<meta name="description" content="Akagi Technologies">
<meta name="theme-color" content="#f4f1ea">
<meta property="og:title" content="Akagi Technologies">
<meta property="og:site_name" content="Akagi Technologies">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20fill='%23f4f1ea'/%3E%3Ccircle%20cx='16'%20cy='16'%20r='8.5'%20fill='none'%20stroke='%2316150f'%20stroke-width='2.5'/%3E%3C/svg%3E">

<style>
  /* ---- reset ------------------------------------------------------- */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  /* ---- shared spine ------------------------------------------------ */
  :root {
    --serif: ui-serif, "Iowan Old Style", "Palatino Linotype", Palatino,
             "Book Antiqua", Georgia, "Times New Roman", serif;
    --pattern: none;
    --pattern-size: auto;
    --veil: none;
    --drift-x: 0px;
    --drift-y: 0px;
    --drift-time: 90s;
    --place: center;
    --pad: 8vmin;
    --align: center;
    --lift: 0;
  }

  body {
    min-height: 100vh;
    min-height: 100svh;
    background-color: var(--paper);
    color: var(--ink);
    font-family: var(--serif);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* Decorative pattern layer. Paper sits on .field; the pattern rides on
     ::before, oversized so its slow drift never exposes an edge; ::after
     holds a static paper-coloured veil that stays put while it moves. */
  .field {
    position: fixed;
    inset: 0;
    z-index: -1;
    overflow: hidden;
    background-color: var(--paper);
  }
  .field::before,
  .field::after { content: ""; position: absolute; }

  .field::before {
    inset: -25%;
    background-image: var(--pattern);
    background-size: var(--pattern-size);
    will-change: transform;
    animation:
      fade 1.6s ease both,
      drift var(--drift-time) linear infinite;
  }
  .field::after { inset: 0; background: var(--veil); z-index: 1; }

  /* The canvas redraws the same lattice with per-element entropy. It only
     takes over when JS runs and the variant has a lattice to break down —
     otherwise the CSS pattern above stays as the fallback. */
  .grain {
    position: absolute;
    inset: 0;
    display: none;
    width: 100%;
    height: 100%;
    animation: fade 1.6s ease both;
  }
  html.entropy .field::before { display: none; }
  html.entropy .grain { display: block; }

  /* Drift translates by exactly one tile period, so the loop is seamless. */
  @keyframes drift {
    from { transform: translate3d(0, 0, 0); }
    to   { transform: translate3d(var(--drift-x), var(--drift-y), 0); }
  }
  /* v4 has no tiling to loop — its wash breathes instead. */
  @keyframes breathe {
    from { transform: translate3d(-1.5%, -1%, 0) scale(1.04); }
    to   { transform: translate3d( 1.5%,  1%, 0) scale(1.10); }
  }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes rise {
    from { opacity: 0; transform: translateY(calc(-1 * var(--lift) + .4em)); }
    to   { opacity: 1; transform: translateY(calc(-1 * var(--lift))); }
  }

  .stage {
    min-height: 100vh;
    min-height: 100svh;
    display: grid;
    place-content: var(--place);
    padding: var(--pad);
    text-align: var(--align);
  }

  .wordmark {
    margin: 0;
    font-weight: 400;
    font-size: var(--size);
    line-height: var(--leading, 1);
    letter-spacing: var(--tracking, 0);
    transform: translateY(calc(-1 * var(--lift)));
    animation: rise 1.05s cubic-bezier(.22, .68, .24, 1) .1s both;
  }
  .wordmark span { display: block; }

  /* ---- v1 — hairline grid, warm paper ------------------------------ */
  [data-variant="v1"] {
    --paper: #f4f1ea;
    --ink: #16150f;
    --pattern:
      repeating-linear-gradient(0deg,  rgba(22,21,15,.10) 0 1px, transparent 1px 34px),
      repeating-linear-gradient(90deg, rgba(22,21,15,.10) 0 1px, transparent 1px 34px);
    --drift-x: 34px;
    --drift-y: 34px;
    --drift-time: 90s;
    --size: clamp(2.6rem, 9vw, 7.5rem);
    --leading: .94;
    --tracking: -.015em;
    --lift: 4vh;
  }

  /* ---- v2 — dot field, dark paper ---------------------------------- */
  [data-variant="v2"] {
    --paper: #101418;
    --ink: #e8ebee;
    --pattern: radial-gradient(circle, rgba(232,235,238,.24) 1.4px, transparent 1.5px);
    --pattern-size: 30px 30px;
    --veil: radial-gradient(circle at 50% 42%, transparent 20%, var(--paper) 78%);
    --drift-x: 30px;
    --drift-y: 30px;
    --drift-time: 110s;
    --place: end start;
    --align: left;
    --pad: clamp(28px, 7vmin, 84px);
    --size: clamp(1.15rem, 3.2vw, 2.2rem);
    --leading: 1.5;
    --tracking: .24em;
  }
  [data-variant="v2"] .wordmark { font-variant-caps: all-small-caps; }

  /* ---- v3 — ruled, ivory ------------------------------------------- */
  [data-variant="v3"] {
    --paper: #faf6ec;
    --ink: #1a1712;
    --pattern: repeating-linear-gradient(0deg, rgba(26,23,18,.12) 0 1px, transparent 1px 46px);
    --drift-x: 0px;
    --drift-y: 46px;
    --drift-time: 70s;
    --size: clamp(1.5rem, 5vw, 3.4rem);
    --leading: 1.35;
    --tracking: .02em;
    --lift: 2vh;
  }
  [data-variant="v3"] .wordmark {
    border-bottom: 1px solid var(--ink);
    padding-bottom: .28em;
  }
  [data-variant="v3"] .wordmark span { display: inline; }

  /* ---- v4 — tint wash, no pattern ---------------------------------- */
  [data-variant="v4"] {
    --paper: #d9e0d5;
    --ink: #22281f;
    --pattern: radial-gradient(125% 95% at 18% 0%, rgba(255,255,255,.55), transparent 62%);
    --pattern-size: cover;
    --place: center start;
    --align: left;
    --pad: clamp(32px, 9vmin, 140px);
    --size: clamp(3rem, 12vw, 10rem);
    --leading: .88;
    --tracking: -.025em;
  }
  [data-variant="v4"] .field::before {
    animation: fade 1.6s ease both, breathe 48s ease-in-out infinite alternate;
  }

  /* ---- v5 — diagonal hairlines, dark paper, knocked-out panel ------- */
  [data-variant="v5"] {
    --paper: #14151a;
    --ink: #eceae4;
    --pattern: repeating-linear-gradient(45deg, rgba(236,234,228,.07) 0 1px, transparent 1px 15px);
    /* one 15px period along the gradient axis = 15/sqrt(2) on each axis */
    --drift-x: 10.607px;
    --drift-y: -10.607px;
    --drift-time: 80s;
    --size: clamp(1.9rem, 6.5vw, 5rem);
    --leading: 1.05;
    --tracking: .01em;
  }
  [data-variant="v5"] .wordmark {
    background: var(--paper);
    padding: clamp(20px, 5vmin, 56px) clamp(24px, 6vmin, 72px);
  }

  /* ---- motion opt-out ---------------------------------------------- */
  @media (prefers-reduced-motion: reduce) {
    .field::before,
    [data-variant="v4"] .field::before,
    .wordmark { animation: none; }
  }
</style>

<script>
  (function () {
    var V = ["v1", "v2", "v3", "v4", "v5"];
    var THEME = { v1: "#f4f1ea", v2: "#101418", v3: "#faf6ec", v4: "#d9e0d5", v5: "#14151a" };
    var KEY = "akagi:variant";

    var forced = (location.search.match(/[?&]v=v?(\d)/) || [])[1];
    var pick;

    if (forced && V.indexOf("v" + forced) > -1) {
      pick = "v" + forced;
    } else {
      var last = null;
      try { last = sessionStorage.getItem(KEY); } catch (e) {}
      pick = V[Math.floor(Math.random() * V.length)];
      if (pick === last) pick = V[Math.floor(Math.random() * V.length)];
      try { sessionStorage.setItem(KEY, pick); } catch (e) {}
    }

    document.documentElement.setAttribute("data-variant", pick);
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", THEME[pick]);
  })();
</script>
</head>

<body>
  <div class="field" aria-hidden="true"><canvas class="grain"></canvas></div>
  <main class="stage">
    <h1 class="wordmark"><span>Akagi</span> <span>Technologies</span></h1>
  </main>

<script>
  /* Redraws the variant's lattice with per-element entropy on a slow
     order -> breakdown -> order cycle. The wordmark is never touched.
     Falls back to the static CSS pattern if this doesn't run. */
  (function () {
    var root = document.documentElement;

    var SPEC = {
      v1: { kind: "grid",  step: 34, ink: "22,21,15",    alpha: .10, amp: 44, seg: 34,  dx: 34, dy: 34,  cycle: 90000 },
      v2: { kind: "dots",  step: 30, ink: "232,235,238", alpha: .24, amp: 38, dot: 1.4, dx: 30, dy: 30,  cycle: 110000 },
      v3: { kind: "rules", step: 46, ink: "26,23,18",    alpha: .12, amp: 46, seg: 68,  dx: 0,  dy: 46,  cycle: 70000 },
      v5: { kind: "diag",  step: 15, ink: "236,234,228", alpha: .07, amp: 30, seg: 120, dx: 15, dy: 0,   cycle: 80000 }
    };

    var spec = SPEC[root.getAttribute("data-variant")];
    if (!spec) return;                       /* v4 has no lattice to break */

    var canvas = document.querySelector(".grain");
    if (!canvas || !canvas.getContext) return;
    var ctx = canvas.getContext("2d");
    if (!ctx) return;
    root.classList.add("entropy");

    var still = window.matchMedia &&
                window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    var TAU = Math.PI * 2;
    var ENTROPY_CYCLE = 60000;
    var LEVELS = 4;                          /* alpha buckets, so a frame is
                                                4 draw calls, not thousands */
    var W = 0, H = 0, bucket = [];

    /* Same lattice cell always gets the same jitter, so elements keep their
       identity frame to frame instead of reshuffling. */
    function noise(a, b, salt) {
      var x = Math.sin(a * 127.1 + b * 311.7 + salt * 74.7) * 43758.5453;
      return x - Math.floor(x);
    }

    /* ?e=0..1 pins entropy, for checking what the canvas is actually doing. */
    var forced = (location.search.match(/[?&]e=([0-9.]+)/) || [])[1];
    var pinned = forced === undefined ? null
               : Math.max(0, Math.min(1, parseFloat(forced) || 0));

    /* Each load enters the cycle somewhere different. Starting every visit
       at perfect order means a short look sees nothing happen at all. */
    var phase = Math.random() * ENTROPY_CYCLE;

    function entropyAt(t) {
      var e = .5 - .5 * Math.cos(TAU * (((t + phase) % ENTROPY_CYCLE) / ENTROPY_CYCLE));
      return Math.pow(e, 1.7);               /* linger in order, pass through chaos */
    }

    function reset() {
      bucket = [];
      for (var i = 0; i < LEVELS; i++) bucket.push([]);
    }
    function level(f) {
      var i = Math.floor(f * LEVELS);
      return bucket[i < 0 ? 0 : i > LEVELS - 1 ? LEVELS - 1 : i];
    }

    /* Both ends wander and the span shortens, so gaps open as it decays. */
    function segment(x1, y1, x2, y2, a, b, e) {
      var t1 = noise(a, b, 1) * TAU, r1 = noise(a, b, 2) * e * spec.amp;
      var t2 = noise(a, b, 3) * TAU, r2 = noise(a, b, 4) * e * spec.amp;
      var s = 1 - .5 * e * noise(a, b, 5);
      var mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
      level(1 - .75 * e * noise(a, b, 6)).push(
        mx + (x1 - mx) * s + Math.cos(t1) * r1, my + (y1 - my) * s + Math.sin(t1) * r1,
        mx + (x2 - mx) * s + Math.cos(t2) * r2, my + (y2 - my) * s + Math.sin(t2) * r2
      );
    }

    function strokeBuckets() {
      ctx.lineWidth = 1;
      ctx.strokeStyle = "rgb(" + spec.ink + ")";
      for (var i = 0; i < LEVELS; i++) {
        var a = bucket[i];
        if (!a.length) continue;
        ctx.globalAlpha = spec.alpha * ((i + .5) / LEVELS);
        ctx.beginPath();
        for (var j = 0; j < a.length; j += 4) {
          ctx.moveTo(a[j], a[j + 1]);
          ctx.lineTo(a[j + 2], a[j + 3]);
        }
        ctx.stroke();
      }
    }

    function fillBuckets() {
      ctx.fillStyle = "rgb(" + spec.ink + ")";
      for (var i = 0; i < LEVELS; i++) {
        var a = bucket[i];
        if (!a.length) continue;
        ctx.globalAlpha = spec.alpha * ((i + .5) / LEVELS);
        ctx.beginPath();
        for (var j = 0; j < a.length; j += 3) {
          ctx.moveTo(a[j] + a[j + 2], a[j + 1]);
          ctx.arc(a[j], a[j + 1], a[j + 2], 0, TAU);
        }
        ctx.fill();
      }
    }

    function draw(t) {
      var e = pinned !== null ? pinned : still ? 0 : entropyAt(t);
      var step = spec.step, seg = spec.seg;
      var M = spec.amp + step;
      /* Unwrapped drift: each element keeps its identity as it travels. */
      var ox = still ? 0 : t / spec.cycle * spec.dx;
      var oy = still ? 0 : t / spec.cycle * spec.dy;
      var k, j, x, y;

      ctx.clearRect(0, 0, W, H);
      reset();

      if (spec.kind === "dots") {
        for (k = Math.floor((-M + ox) / step); k <= Math.ceil((W + M + ox) / step); k++) {
          for (j = Math.floor((-M + oy) / step); j <= Math.ceil((H + M + oy) / step); j++) {
            var ang = noise(k, j, 1) * TAU, rad = noise(k, j, 2) * e * spec.amp;
            level(1 - .8 * e * noise(k, j, 3)).push(
              k * step - ox + Math.cos(ang) * rad,
              j * step - oy + Math.sin(ang) * rad,
              Math.max(spec.dot * (1 - .4 * e * noise(k, j, 4)), .25)
            );
          }
        }
        fillBuckets();
        return;
      }

      if (spec.kind === "diag") {
        var span = Math.sqrt(W * W + H * H) / 2 + M;
        ctx.save();
        ctx.translate(W / 2, H / 2);
        ctx.rotate(-Math.PI / 4);
        for (k = Math.floor((-span + ox) / step); k <= Math.ceil((span + ox) / step); k++) {
          x = k * step - ox;
          for (j = Math.floor(-span / seg); j <= Math.ceil(span / seg); j++) {
            segment(x, j * seg, x, (j + 1) * seg, k * 13 + 5, j * 97 + 2, e);
          }
        }
        strokeBuckets();
        ctx.restore();
        return;
      }

      /* grid and rules: horizontal runs, plus verticals for the grid */
      for (j = Math.floor((-M + oy) / step); j <= Math.ceil((H + M + oy) / step); j++) {
        y = j * step - oy;
        for (k = Math.floor(-M / seg); k <= Math.ceil((W + M) / seg); k++) {
          segment(k * seg, y, (k + 1) * seg, y, k * 7 + 1, j * 31 + 7, e);
        }
      }
      if (spec.kind === "grid") {
        for (k = Math.floor((-M + ox) / step); k <= Math.ceil((W + M + ox) / step); k++) {
          x = k * step - ox;
          for (j = Math.floor(-M / seg); j <= Math.ceil((H + M) / seg); j++) {
            segment(x, j * seg, x, (j + 1) * seg, k * 17 + 3, j * 53 + 11, e);
          }
        }
      }
      strokeBuckets();
    }

    function resize() {
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = canvas.clientWidth;
      H = canvas.clientHeight;
      canvas.width = Math.round(W * dpr);
      canvas.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      if (still) draw(0);
    }

    var start = null, last = -1e9;
    function frame(now) {
      if (start === null) start = now;
      if (now - last >= 33 && !document.hidden) { last = now; draw(now - start); }
      requestAnimationFrame(frame);
    }

    window.addEventListener("resize", resize);
    resize();
    if (!still) requestAnimationFrame(frame);
  })();
</script>
</body>
</html>
