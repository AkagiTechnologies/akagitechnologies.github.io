title: "Akagi Technologies"
author: "Synthetic Cereluean Mite"
description: "Akagi Technologies" # This will show up in places like twitter, linkedin, etc, if you share your sites url as a post.

# The site currently publishes a single static placeholder (index.html).
# The blog below is kept intact but excluded from the build — delete this
# `exclude` block to bring it back.
exclude:
  - _posts
  - _layouts
  - _includes
  - archive.md
  - index.md
  - css
  - js

# Email / Social media user names used by the minima theme:
# All of these are optional and can be removed or commented out
email: "example@mail.com"
twitter_username: "twitteruser"
github_username: "githubuser"
linkedin_username: "linkedinuser"
#facebook_username: username
#flickr_username: username
#instagram_username: username
#pinterest_username: username
#youtube_username: username
#googleplus_username: +username

#########################################################################################
######### Nothing below needs to be changed (unless you know what you're doing) #########
#########################################################################################
theme: "minima"

rss: rss

kramdown:
  syntax_highlighter_opts:
    disable: true
    
plugins:
  #- jekyll-feed   # re-enable alongside the `exclude` block above
  - jekyll-sitemap

titles_from_headings:
  strip_title: true
  collections: true

defaults:
  - scope:
      path: ""
      type: post
    values:
      tags: Other
